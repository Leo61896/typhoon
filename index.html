<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颱風對台灣影響：原理 3D / 向量互動視覺化工作台</title>
    <style>
        :root {
            --bg-dark: #070b19;
            --panel-glass: rgba(13, 22, 47, 0.75);
            --neon-cyan: #00f3ff;
            --neon-blue: #0066ff;
            --neon-red: #ff3366;
            --neon-gold: #ffcc00;
            --text-main: #e2e8f0;
            --bounce-cubic: cubic-bezier(0.34, 1.56, 0.64, 1);
            --typhoon-speed: 4s;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }
        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 10px; width: 100%; max-width: 1000px; }
        h1 { margin: 0; font-size: 24px; letter-spacing: 2px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .workbench { display: grid; grid-template-columns: 1fr 350px; gap: 20px; width: 100%; max-width: 1000px; }
        .stage-container { background: var(--panel-glass); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: 12px; height: 500px; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; backdrop-filter: blur(10px); perspective: 1000px; }
        .view-matrix { width: 400px; height: 400px; position: relative; transform-style: preserve-3d; transform: rotateX(45deg) rotateY(0deg) rotateZ(-30deg); transition: transform 0.6s var(--bounce-cubic); }
        .view-matrix.isometric { transform: rotateX(60deg) rotateY(0deg) rotateZ(-45deg) scale3d(0.85, 0.85, 0.85); }
        .view-matrix.flat { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
        .taiwan-layer, .mountain-layer, .typhoon-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .taiwan-layer { transform: translateZ(0px); }
        .mountain-layer { transform: translateZ(30px); opacity: 0.8; }
        .typhoon-layer { transform: translateZ(80px); }
        .typhoon-rotor { width: 100%; height: 100%; animation: spin var(--typhoon-speed) linear infinite; transform-origin: 50% 50%; }
        @keyframes spin { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        .control-panel { background: var(--panel-glass); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 20px; backdrop-filter: blur(10px); }
        .panel-section { border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; }
        .panel-section:last-child { border: none; }
        .section-title { font-size: 13px; color: var(--neon-cyan); margin-bottom: 10px; letter-spacing: 1px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { background: rgba(0, 102, 255, 0.15); border: 1px solid var(--neon-blue); color: var(--text-main); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: monospace; transition: transform 0.1s var(--bounce-cubic), box-shadow 0.2s; }
        .btn:hover { transform: scale(1.05); background: rgba(0, 243, 255, 0.2); border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); }
        .btn:active { transform: scale(0.95); }
        .btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); font-weight: bold; }
        .scrubber-container { display: flex; flex-direction: column; gap: 5px; }
        .scrubber { -webkit-appearance: none; width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; }
        .scrubber::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--neon-cyan); cursor: pointer; box-shadow: 0 0 8px var(--neon-cyan); }
        .hud-data { font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 5px; }
        .hud-row { display: flex; justify-content: space-between; }
        .hud-val { color: var(--neon-gold); font-weight: bold; }
        .radar-line { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawStroke 3s linear infinite; }
        @keyframes drawStroke { to { stroke-dashoffset: 0; } }
        .fps-badge { position: absolute; top: 15px; right: 15px; background: rgba(0,255,102,0.15); border: 1px solid #00ff66; color: #00ff66; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-family: monospace; z-index: 10; }
    </style>
</head>
<body>
<header>
    <h1>TYPHOON INTERACTIVE WORKBENCH</h1>
    <div style="font-size: 12px; color: #64748b; margin-top: 4px;">模擬氣流與降雨原理 · 3D 向量幾何防禦分析</div>
</header>
<div class="workbench">
    <div class="stage-container">
        <div class="fps-badge" id="fpsDisplay">FPS: 60.0</div>
        <div class="view-matrix" id="mainMatrix">
            <svg class="taiwan-layer" viewBox="0 0 400 400">
                <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0, 243, 255, 0.04)" stroke-width="1"/></pattern></defs>
                <rect width="100%" height="100%" fill="url(#grid)" />
                <path d="M200,80 L230,140 L240,200 L230,260 L210,320 L190,340 L180,310 L175,250 L160,180 L180,120 Z" fill="rgba(0, 102, 255, 0.2)" stroke="var(--neon-blue)" stroke-width="2" />
                <circle cx="200" cy="210" r="140" fill="none" stroke="rgba(0, 243, 255, 0.15)" stroke-width="1" stroke-dasharray="5,5" />
            </svg>
            <svg class="mountain-layer" id="mountainLayer" viewBox="0 0 400 400">
                <path d="M195,110 L215,160 L220,210 L210,270 L195,310 L190,270 L200,210 L190,160 Z" fill="rgba(255, 204, 0, 0.25)" stroke="var(--neon-gold)" stroke-width="1.5" />
            </svg>
            <div class="typhoon-layer"><div class="typhoon-rotor" id="typhoonRotor">
                    <svg width="100%" height="100%" viewBox="0 0 400 400">
                        <circle cx="200" cy="210" r="20" fill="none" stroke="var(--neon-red)" stroke-width="2" />
                        <path class="radar-line" d="M200,210 Q260,170 290,230 T360,210" fill="none" stroke="var(--neon-cyan)" stroke-width="2" />
                        <path class="radar-line" d="M200,210 Q140,250 110,190 T40,210" fill="none" stroke="rgba(0, 243, 255, 0.6)" stroke-width="1.5" />
                    </svg>
            </div></div>
        </div>
    </div>
    <div class="control-panel">
        <div class="panel-section">
            <div class="section-title">3D Matrix Perspective / 空間視角</div>
            <div class="btn-group">
                <button class="btn" onclick="changeView('perspective')">等角透視</button>
                <button class="btn active" id="btnIsometric" onclick="changeView('isometric')">3D 剖面</button>
                <button class="btn" onclick="changeView('flat')">2D 正視</button>
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">Simulation Loop / 動態調校</div>
            <div class="btn-group">
                <button class="btn active" id="btnPlay" onclick="toggleSimulation(true)">運轉播放</button>
                <button class="btn" id="btnPause" onclick="toggleSimulation(false)">暫停隔離</button>
            </div>
            <div class="scrubber-container" style="margin-top:15px;">
                <div class="hud-row"><span style="font-size:11px; color:#8a99ad;">颱風環流旋轉速率</span><span class="hud-val" id="speedVal">1.0x</span></div>
                <input type="range" class="scrubber" id="speedScrubber" min="0.2" max="3" step="0.1" value="1" oninput="updateSpeed(this.value)">
            </div>
        </div>
        <div class="panel-section">
            <div class="section-title">Telemetry Data / 氣象物理參數</div>
            <div class="hud-data">
                <div class="hud-row"><span>結構破壞率 (地形阻尼)</span><span class="hud-val" id="teleDestroy">32.4%</span></div>
                <div class="hud-row"><span>核心低壓 (Pressure)</span><span class="hud-val">945 hPa</span></div>
                <div class="hud-row"><span>16.6ms 預算餘額</span><span class="hud-val" style="color:#00ff66;">14.8 ms</span></div>
            </div>
            <div style="margin-top:12px; display:flex; gap:10px;">
                <button class="btn" onclick="triggerEffectSound('snap')" style="flex:1; border-color:var(--neon-gold);">模擬地形碰撞</button>
                <button class="btn" onclick="triggerEffectSound('chord')" style="flex:1; border-color:var(--neon-cyan);">安全存檔驗收</button>
            </div>
        </div>
    </div>
</div>
<script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext; let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
    function triggerEffectSound(type) {
        initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination); const now = audioCtx.currentTime;
        if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); gainNode.gain.setValueAtTime(0.15, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05); osc.start(now); osc.stop(now + 0.05); }
